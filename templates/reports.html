<!DOCTYPE html>

<html>
<head>
<title>Reports</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    text-align: center;
}

.container {
    padding: 20px;
}

.title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* UPLOAD BOX */
.upload-box {
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
    max-width: 500px;
    margin: auto;
}

.upload-btn {
    margin-top: 10px;
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    border-radius: 20px;
}

/* FILE LIST */
.file {
    margin-top: 15px;
    background: rgba(255,255,255,0.2);
    padding: 10px;
    border-radius: 10px;
}

.actions a {
    margin: 5px;
    padding: 5px 10px;
    background: white;
    color: black;
    border-radius: 8px;
    text-decoration: none;
    font-size: 12px;
}
</style>

</head>

<body>

<div class="container">

<div class="title">📂 Medical Reports</div>

<!-- UPLOAD -->
<div class="upload-box">
<form method="POST" enctype="multipart/form-data">
<input type="file" name="file" required><br>
<button class="upload-btn">Upload</button>
</form>
</div>

<!-- FILE LIST -->
{% for r in reports %}

<div class="file">
<p>{{ r[1] }}</p>

<div class="actions">
<a href="/uploads/{{ r[1] }}" target="_blank">View</a>
<a href="/download/{{ r[1] }}">Download</a>
<a href="/delete/{{ r[0] }}">Delete</a>
</div>

</div>
{% endfor %}

</div>

</body>
</html>
